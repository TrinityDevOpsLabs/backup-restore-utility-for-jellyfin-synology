name: Tests

on:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Tests and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          command -v rsync
          python -m pip install coverage==7.10.7
      - name: Run tests
        run: python -m coverage run --include='*/jellyfin_backup_restore.py' -m unittest discover -s tests -v
      - name: Enforce 80% line coverage
        run: python -m coverage report --show-missing --fail-under=80
